name: Verify examples

# Each design is its own matrix job, so GitHub shows one check per design and
# a failure names the design that failed rather than "the sweep".  The matrix
# comes from scripts/verify_examples.sh --list, so the list of designs lives
# in one place instead of drifting between the script and this file.

on:
  push:
    branches: [main]
    paths:
      - '.gitmodules'
      - 'nextpnr'
      - 'fasm2netlist'
      - 'examples/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/verify-examples.yml'
  pull_request:
    branches: [main]
    paths:
      - '.gitmodules'
      - 'nextpnr'
      - 'fasm2netlist'
      - 'examples/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/verify-examples.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  designs:
    name: Enumerate designs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.designs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "designs=$(bash scripts/verify_examples.sh --list)" >> "$GITHUB_OUTPUT"

  tools:
    name: Build tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libeigen3-dev \
            libboost-all-dev python3 python3-venv libz3-dev

      - name: Fetch the Project X-Ray database
        run: git clone --depth 1 https://github.com/openXC7/prjxray-db .deps/prjxray-db

      # A chipdb is a function of the generator, the constant ids and the
      # database it reads.  cmake only knows about the first two, so the
      # database goes in the key: without it a database change would be
      # invisible and the cache would serve a chipdb built from the old one.
      - name: Work out the cache key
        id: keys
        run: |
          echo "nextpnr=$(git -C nextpnr rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "db=$(git -C .deps/prjxray-db rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Generating a chipdb needs far more memory than a runner has to spare,
      # so the intermediate .bba is cached.  One cache per device: a rebuild
      # of either would otherwise discard both, and together they are 468 MB
      # against a 10 GB repository budget.
      #
      # No restore-keys.  A prefix match would hand back a .bba built from
      # different inputs, and the whole point of the key is that a hit means
      # the file is current.  An exact miss rebuilds: slow, never wrong.
      - name: Restore xc7a50t chipdb
        id: cache-a50t
        uses: actions/cache/restore@v4
        with:
          path: build/himbaechel/uarch/xilinx/chipdb-xc7a50t.bba
          key: chipdb-xc7a50t-${{ steps.keys.outputs.nextpnr }}-${{ steps.keys.outputs.db }}

      - name: Restore xc7vx485t chipdb
        id: cache-vx485t
        uses: actions/cache/restore@v4
        with:
          path: build/himbaechel/uarch/xilinx/chipdb-xc7vx485t.bba
          key: chipdb-xc7vx485t-${{ steps.keys.outputs.nextpnr }}-${{ steps.keys.outputs.db }}

      # Without this the cache saves nothing at all.  cmake rebuilds the .bba
      # when it is older than xilinx_gen.py, and it always is: checkout stamps
      # every source file with the time it ran, while the cache restores the
      # .bba with the mtime it had when it was built.  So the generator looks
      # newer, make regenerates, and the fifteen expensive minutes the cache
      # exists to avoid are spent on every run regardless of a hit.  The key
      # pins all three inputs, so a hit does mean current -- say so.
      - name: Accept the restored chipdbs as current
        run: |
          shopt -s nullglob
          files=(build/himbaechel/uarch/xilinx/chipdb-*.bba)
          if [ ${#files[@]} -gt 0 ]; then touch "${files[@]}"; echo "marked ${#files[@]} restored chipdb(s) current"
          else echo "no chipdb restored; both will be generated"; fi

      - name: Build nextpnr-himbaechel
        run: |
          cmake -S nextpnr -B build -DARCH=himbaechel -DHIMBAECHEL_UARCH=xilinx \
            -DBUILD_GUI=OFF -DBUILD_PYTHON=OFF \
            -DHIMBAECHEL_XILINX_DEVICES="xc7a50t;xc7vx485t" \
            -DHIMBAECHEL_PRJXRAY_DB="$PWD/.deps/prjxray-db"
          cmake --build build --target nextpnr-himbaechel --parallel "$(nproc)"

      # Saved separately from the restore, and unconditionally, because
      # actions/cache only saves when the job succeeds -- and a job that ran
      # out of memory on the second chipdb is exactly the one whose first
      # chipdb is worth keeping.  Without this the expensive case is the one
      # that never gets cheaper.
      - name: Save xc7a50t chipdb
        if: always() && steps.cache-a50t.outputs.cache-hit != 'true' && hashFiles('build/himbaechel/uarch/xilinx/chipdb-xc7a50t.bba') != ''
        uses: actions/cache/save@v4
        with:
          path: build/himbaechel/uarch/xilinx/chipdb-xc7a50t.bba
          key: chipdb-xc7a50t-${{ steps.keys.outputs.nextpnr }}-${{ steps.keys.outputs.db }}

      - name: Save xc7vx485t chipdb
        if: always() && steps.cache-vx485t.outputs.cache-hit != 'true' && hashFiles('build/himbaechel/uarch/xilinx/chipdb-xc7vx485t.bba') != ''
        uses: actions/cache/save@v4
        with:
          path: build/himbaechel/uarch/xilinx/chipdb-xc7vx485t.bba
          key: chipdb-xc7vx485t-${{ steps.keys.outputs.nextpnr }}-${{ steps.keys.outputs.db }}

      - name: Build the extractor and the equivalence checker
        run: |
          cmake -S fasm2netlist -B fasm2netlist/build -DCMAKE_BUILD_TYPE=Release
          cmake --build fasm2netlist/build --parallel "$(nproc)"

      # The chipdb comes from the share tree, not the build tree.  cmake
      # writes a copy under himbaechel/uarch/xilinx/ as well, but that is not
      # the one nextpnr opens: it resolves the path through
      # proc_share_dirname(), so build/share/himbaechel/xilinx is what a job
      # that did not build nextpnr itself has to be given.  Handing over the
      # other copy leaves the binary reporting "Unable to read chipdb" about a
      # second after it starts.
      - name: Check the chipdb is where nextpnr will look for it
        run: test -s build/share/himbaechel/xilinx/chipdb-xc7a50t.bin &&
             test -s build/share/himbaechel/xilinx/chipdb-xc7vx485t.bin

      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: tools
          path: |
            build/nextpnr-himbaechel
            build/share/himbaechel/xilinx/chipdb-*.bin
            fasm2netlist/build/tileverilog
            fasm2netlist/build/lvs_equiv
          retention-days: 1

  verify:
    name: ${{ matrix.design }}
    needs: [designs, tools]
    runs-on: ubuntu-latest
    strategy:
      # One design failing says nothing about the others, and the whole point
      # of the matrix is to see which ones are affected.
      fail-fast: false
      matrix:
        design: ${{ fromJSON(needs.designs.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # nextpnr is built in another job and only run here, so this job needs
      # the libraries it was linked against even though it compiles nothing:
      # boost's program_options, iostreams and thread, plus z3 for the
      # equivalence checker.  The -dev metapackages pull whichever runtime
      # version the image carries, rather than naming 1.83 and breaking on the
      # day the image moves.
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys libz3-4 \
            libboost-program-options-dev libboost-iostreams-dev libboost-thread-dev

      - name: Fetch the Project X-Ray database
        run: git clone --depth 1 https://github.com/openXC7/prjxray-db .deps/prjxray-db

      - uses: actions/download-artifact@v4
        with:
          name: tools

      - name: Restore the executable bit
        run: chmod +x build/nextpnr-himbaechel fasm2netlist/build/tileverilog fasm2netlist/build/lvs_equiv

      # Fail here, with a name that says what is wrong, rather than letting a
      # missing chipdb or an unloadable library surface as "place and route
      # failed" a step later.  Each binary is RUN, not merely tested for the
      # executable bit: a binary whose shared libraries are absent is still
      # executable and still cannot start, which is exactly how a missing
      # boost went unnoticed until it looked like a routing failure.
      - name: Check the tools arrived intact and can run
        run: |
          set -e
          test -s build/share/himbaechel/xilinx/chipdb-xc7a50t.bin
          test -s build/share/himbaechel/xilinx/chipdb-xc7vx485t.bin
          build/nextpnr-himbaechel --version
          for t in fasm2netlist/build/tileverilog fasm2netlist/build/lvs_equiv; do
              # 126/127 mean "could not execute" -- anything else means it ran
              # and printed its usage, which is all this needs to establish.
              # The status has to be captured, not tested after `|| true`,
              # which would reset it and make this check unable to fail.
              rc=0
              "$t" --help >/dev/null 2>&1 || rc=$?
              case $rc in 126|127) echo "$t cannot run"; exit 1 ;; esac
          done

      - name: Build the bitstream and prove the extraction equals it
        env:
          PRJXRAY_DB: .deps/prjxray-db
          YOSYS: yosys
        run: bash scripts/verify_examples.sh "${{ matrix.design }}"

      - name: Upload the extraction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-${{ matrix.design }}
          path: .verify/examples/${{ matrix.design }}
          retention-days: 7
