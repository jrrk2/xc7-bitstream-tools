name: Build VC707 Bitstream

on:
  push:
    branches:
      - main
    paths:
      - '.gitmodules'
      - 'nextpnr'
      - 'examples/vc707-johnson/**'
      - 'scripts/**'
      - 'backends/**'
      - '.github/workflows/build-vc707.yml'
      - '.github/ci/build_vc707.sh'
  pull_request:
    branches:
      - main
    paths:
      - '.gitmodules'
      - 'nextpnr'
      - 'examples/vc707-johnson/**'
      - 'scripts/**'
      - 'backends/**'
      - '.github/workflows/build-vc707.yml'
      - '.github/ci/build_vc707.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build VC707 Johnson Bitstream
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # The database is cloned here rather than inside the build script (which
      # skips it when the directory exists) so its commit can go in the cache
      # key: a chipdb is a function of the generator and the database both,
      # and cmake only tracks the generator.
      - name: Fetch the Project X-Ray database
        run: git clone --depth 1 https://github.com/openXC7/prjxray-db .deps/prjxray-db

      - name: Work out the cache key
        id: keys
        run: |
          echo "nextpnr=$(git -C nextpnr rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "db=$(git -C .deps/prjxray-db rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The same keys verify-examples.yml uses, so the two workflows share one
      # chipdb rather than generating it twice per push.  Both devices, since
      # this build configures both and caching only one left the other being
      # regenerated every time.
      - name: Restore xc7a50t chipdb
        id: cache-a50t
        uses: actions/cache/restore@v4
        with:
          path: build/himbaechel/uarch/xilinx/chipdb-xc7a50t.bba
          key: chipdb-xc7a50t-${{ steps.keys.outputs.nextpnr }}-${{ steps.keys.outputs.db }}

      - name: Restore xc7vx485t chipdb
        id: cache-vx485t
        uses: actions/cache/restore@v4
        with:
          path: build/himbaechel/uarch/xilinx/chipdb-xc7vx485t.bba
          key: chipdb-xc7vx485t-${{ steps.keys.outputs.nextpnr }}-${{ steps.keys.outputs.db }}

      # cmake rebuilds a .bba older than xilinx_gen.py, and a restored one
      # always is: checkout stamps sources with the time it ran, the cache
      # restores the mtime the file was built with.  So the cache saved
      # nothing until now -- every run regenerated regardless of a hit.
      - name: Accept the restored chipdbs as current
        run: |
          shopt -s nullglob
          files=(build/himbaechel/uarch/xilinx/chipdb-*.bba)
          if [ ${#files[@]} -gt 0 ]; then touch "${files[@]}"; echo "marked ${#files[@]} restored chipdb(s) current"
          else echo "no chipdb restored; both will be generated"; fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libeigen3-dev \
            libboost-all-dev \
            python3 \
            python3-venv \
            yosys \
            libz3-dev

      - name: Run CI build script
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          BUILD_NEXTPNR: 1
          YOSYS: yosys
        run: bash .github/ci/build_vc707.sh

      - name: Save xc7a50t chipdb
        if: always() && steps.cache-a50t.outputs.cache-hit != 'true' && hashFiles('build/himbaechel/uarch/xilinx/chipdb-xc7a50t.bba') != ''
        uses: actions/cache/save@v4
        with:
          path: build/himbaechel/uarch/xilinx/chipdb-xc7a50t.bba
          key: chipdb-xc7a50t-${{ steps.keys.outputs.nextpnr }}-${{ steps.keys.outputs.db }}

      - name: Save xc7vx485t chipdb
        if: always() && steps.cache-vx485t.outputs.cache-hit != 'true' && hashFiles('build/himbaechel/uarch/xilinx/chipdb-xc7vx485t.bba') != ''
        uses: actions/cache/save@v4
        with:
          path: build/himbaechel/uarch/xilinx/chipdb-xc7vx485t.bba
          key: chipdb-xc7vx485t-${{ steps.keys.outputs.nextpnr }}-${{ steps.keys.outputs.db }}

      - name: Upload bitstream artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vc707-bitstream
          path: johnson_vc707.bit
          retention-days: 7

      - name: Publish public release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vc707-build-${{ github.run_number }}
          name: VC707 Johnson bitstream (build ${{ github.run_number }})
          body: |
            Automated release from CI run ${{ github.run_id }}.
            Commit: ${{ github.sha }}
          files: johnson_vc707.bit
          make_latest: true

      - name: Report results
        if: always()
        run: |
          echo "Build Status: ${{ job.status }}"
          if [[ -f johnson_vc707.bit ]]; then
            echo "Bitstream size: $(stat -c %s johnson_vc707.bit) bytes"
            file johnson_vc707.bit || true
          fi
