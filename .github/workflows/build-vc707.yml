name: Build VC707 Bitstream

on:
  push:
    branches:
      - main
    paths:
      - '.gitmodules'
      - 'nextpnr'
      - 'examples/vc707-johnson/**'
      - 'scripts/**'
      - 'backends/**'
      - '.github/workflows/build-vc707.yml'
      - '.github/ci/build_vc707.sh'
  pull_request:
    branches:
      - main
    paths:
      - '.gitmodules'
      - 'nextpnr'
      - 'examples/vc707-johnson/**'
      - 'scripts/**'
      - 'backends/**'
      - '.github/workflows/build-vc707.yml'
      - '.github/ci/build_vc707.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build VC707 Johnson Bitstream
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get nextpnr commit hash for cache key
        id: nextpnr-hash
        run: echo "hash=$(cd nextpnr && git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache xc7vx485t chipdb artifacts
        uses: actions/cache@v4
        with:
          path: build/himbaechel/uarch/xilinx/chipdb-xc7vx485t.bba
          key: xc7vx485t-chipdb-${{ steps.nextpnr-hash.outputs.hash }}
          restore-keys: |
            xc7vx485t-chipdb-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libeigen3-dev \
            libboost-all-dev \
            python3 \
            python3-venv \
            yosys

      - name: Run CI build script
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          BUILD_NEXTPNR: 1
          YOSYS: yosys
        run: bash .github/ci/build_vc707.sh

      - name: Upload bitstream artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vc707-bitstream
          path: johnson_vc707.bit
          retention-days: 7

      - name: Publish public release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vc707-build-${{ github.run_number }}
          name: VC707 Johnson bitstream (build ${{ github.run_number }})
          body: |
            Automated release from CI run ${{ github.run_id }}.
            Commit: ${{ github.sha }}
          files: johnson_vc707.bit
          make_latest: true

      - name: Report results
        if: always()
        run: |
          echo "Build Status: ${{ job.status }}"
          if [[ -f johnson_vc707.bit ]]; then
            echo "Bitstream size: $(stat -c %s johnson_vc707.bit) bytes"
            file johnson_vc707.bit || true
          fi
